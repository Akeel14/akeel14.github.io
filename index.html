<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Singles Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #090a0f;
    --surface: #11131a;
    --surface-hover: #161922;
    --inset: #0b0d12;
    --border: rgba(255, 255, 255, 0.075);
    --border-strong: rgba(255, 255, 255, 0.13);
    --text: #f8fafc;
    --text-sec: #94a3b8;
    --text-muted: #64748b;
    --green: #10b981;
    --green-bright: #34d399;
    --green-soft: rgba(16, 185, 129, 0.11);
    --green-border: rgba(16, 185, 129, 0.28);
    --red: #f43f5e;
    --red-bright: #fb7185;
    --red-soft: rgba(244, 63, 94, 0.11);
    --red-border: rgba(244, 63, 94, 0.28);
    --amber: #f59e0b;
    --amber-bright: #fbbf24;
    --amber-soft: rgba(245, 158, 11, 0.08);
    --amber-border: rgba(245, 158, 11, 0.24);
    --sky: #38bdf8;
    --sky-soft: rgba(56, 189, 248, 0.11);
    --sky-border: rgba(56, 189, 248, 0.28);
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    font-feature-settings: "cv02", "cv03", "cv04", "cv11";
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    overflow-x: hidden;
  }

  body {
    padding: 18px 16px 64px;
    min-height: 100vh;
  }

  @media (min-width: 640px) {
    body {
      padding: 32px 24px 80px;
    }
  }

  .wrap {
    max-width: 660px;
    margin: 0 auto;
  }

  /* Top App Bar */
  .topbar {
    position: relative;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 18px;
  }

  .brand-col {
    display: flex;
    flex-direction: column;
    gap: 5px;
    min-width: 0;
  }

  .brand-row {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .brand-title {
    font-size: 18px;
    font-weight: 700;
    letter-spacing: -0.025em;
    color: var(--text);
  }

  .engine-status {
    display: flex;
    align-items: flex-start;
    gap: 7px;
    font-size: 12px;
    font-weight: 500;
    line-height: 1.4;
    color: var(--text-sec);
    font-variant-numeric: tabular-nums;
  }

  .engine-status .pulse-dot {
    margin-top: 5px;
  }

  .pulse-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--green);
    box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.55);
    animation: livePulse 2.4s infinite ease-out;
    flex-shrink: 0;
  }

  .pulse-dot.syncing {
    background: var(--amber);
    box-shadow: 0 0 8px var(--amber);
  }

  @keyframes livePulse {
    0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.55); }
    70% { box-shadow: 0 0 0 6px rgba(16, 185, 129, 0); }
    100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
  }

  /* Date Navigator */
  .date-nav {
    display: inline-flex;
    align-items: center;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 11px;
    padding: 3px;
    gap: 2px;
    flex-shrink: 0;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
  }

  .date-step {
    width: 30px;
    height: 30px;
    border: none;
    background: transparent;
    color: var(--text-sec);
    border-radius: 8px;
    font-size: 16px;
    font-weight: 600;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-family: inherit;
    transition: background 0.15s ease, color 0.15s ease, opacity 0.15s ease;
  }

  .date-step:hover:not(.disabled) {
    background: rgba(255, 255, 255, 0.06);
    color: var(--text);
  }

  .date-step.disabled {
    opacity: 0.22;
    pointer-events: none;
  }

  .date-trigger {
    border: none;
    background: var(--surface-hover);
    color: var(--text);
    border-radius: 8px;
    padding: 6px 11px;
    font-size: 12.5px;
    font-weight: 600;
    font-family: inherit;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.15s ease;
  }

  .date-trigger:hover {
    background: #1d212d;
  }

  .date-trigger .chev {
    font-size: 10px;
    color: var(--text-muted);
    transition: transform 0.18s ease;
  }

  .date-trigger.open .chev {
    transform: rotate(180deg);
  }

  /* Calendar Popover */
  .date-dropdown {
    position: absolute;
    top: calc(100% + 8px);
    right: 0;
    width: 292px;
    background: #131620;
    border: 1px solid var(--border-strong);
    border-radius: 16px;
    padding: 13px 12px 12px;
    box-shadow: 0 18px 42px rgba(0, 0, 0, 0.72);
    z-index: 60;
    display: none;
  }

  .date-dropdown.show {
    display: block;
  }

  .cal-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
    padding: 0 4px;
  }

  .cal-month {
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
  }

  .cal-net-pill {
    font-size: 11px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 99px;
    font-variant-numeric: tabular-nums;
    background: rgba(255, 255, 255, 0.06);
    color: var(--text-sec);
  }

  .cal-net-pill.pos {
    background: var(--green-soft);
    color: var(--green-bright);
  }

  .cal-net-pill.neg {
    background: var(--red-soft);
    color: var(--red-bright);
  }

  .cal-weekdays {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    text-align: center;
    font-size: 10.5px;
    font-weight: 600;
    color: var(--text-muted);
    margin-bottom: 6px;
  }

  .cal-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
  }

  .cal-day {
    min-height: 38px;
    border: 1px solid transparent;
    border-radius: 9px;
    background: rgba(255, 255, 255, 0.025);
    color: var(--text);
    font-size: 11.5px;
    font-weight: 600;
    font-family: inherit;
    font-variant-numeric: tabular-nums;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1px;
    padding: 3px 1px;
    cursor: pointer;
    transition: all 0.14s ease;
  }

  .cal-day.disabled {
    background: transparent;
    color: rgba(255, 255, 255, 0.16);
    pointer-events: none;
  }

  .cal-day:hover:not(.disabled) {
    background: rgba(255, 255, 255, 0.08);
  }

  .cal-day-pnl {
    font-size: 8.5px;
    font-weight: 700;
    color: var(--text-muted);
  }

  .cal-day.pnl-pos {
    background: var(--green-soft);
    border-color: var(--green-border);
  }

  .cal-day.pnl-pos .cal-day-pnl {
    color: var(--green-bright);
  }

  .cal-day.pnl-neg {
    background: var(--red-soft);
    border-color: var(--red-border);
  }

  .cal-day.pnl-neg .cal-day-pnl {
    color: var(--red-bright);
  }

  .cal-day.pnl-today {
    background: var(--sky-soft);
    border-color: var(--sky-border);
  }

  .cal-day.pnl-today .cal-day-pnl {
    color: var(--sky);
  }

  .cal-day.active {
    box-shadow: 0 0 0 2px #f8fafc;
  }

  /* Scoreboard Hero Card */
  .scoreboard {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 20px 20px 18px;
    margin-bottom: 22px;
    box-shadow: 0 1px 0 rgba(255, 255, 255, 0.04) inset, 0 12px 30px rgba(0, 0, 0, 0.35);
  }

  .sb-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }

  .sb-profit-block {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .sb-eyebrow {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-muted);
  }

  .sb-hero-row {
    display: flex;
    align-items: baseline;
    gap: 10px;
    flex-wrap: wrap;
  }

  .sb-hero-usd {
    font-size: 34px;
    font-weight: 700;
    letter-spacing: -0.035em;
    line-height: 1.05;
    font-variant-numeric: tabular-nums;
    color: var(--text);
  }

  .sb-hero-usd.pos { color: var(--green-bright); }
  .sb-hero-usd.neg { color: var(--red-bright); }

  .sb-unit-pill {
    display: inline-flex;
    align-items: center;
    padding: 4px 10px;
    border-radius: 99px;
    font-size: 13.5px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    background: rgba(255, 255, 255, 0.06);
    color: var(--text-sec);
    border: 1px solid rgba(255, 255, 255, 0.08);
    transform: translateY(-2px);
  }

  .sb-unit-pill.pos {
    background: var(--green-soft);
    color: var(--green-bright);
    border-color: var(--green-border);
  }

  .sb-unit-pill.neg {
    background: var(--red-soft);
    color: var(--red-bright);
    border-color: var(--red-border);
  }

  .sb-wallet-badge {
    display: inline-flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 2px;
    background: var(--inset);
    border: 1px solid var(--border);
    border-radius: 11px;
    padding: 8px 12px;
    font-variant-numeric: tabular-nums;
  }

  .sb-wallet-lbl {
    font-size: 10.5px;
    font-weight: 500;
    color: var(--text-muted);
  }

  .sb-wallet-val {
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
  }

  .sb-stats-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 14px 16px;
    margin-top: 18px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
  }

  @media (min-width: 480px) {
    .sb-stats-grid {
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }
  }

  .sb-stat {
    display: flex;
    flex-direction: column;
    gap: 3px;
  }

  .sb-stat-lbl {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--text-muted);
  }

  .sb-stat-val {
    font-size: 18px;
    font-weight: 700;
    letter-spacing: -0.02em;
    color: var(--text);
    font-variant-numeric: tabular-nums;
    min-height: 22px;
    display: flex;
    align-items: center;
  }

  .sb-stat-val.pos { color: var(--green-bright); }
  .sb-stat-val.neg { color: var(--red-bright); }
  .sb-stat-val.muted { color: var(--text-muted); font-size: 15.5px; font-weight: 600; letter-spacing: -0.01em; }

  .sb-stat-sub {
    font-size: 11.5px;
    font-weight: 500;
    color: var(--text-muted);
    font-variant-numeric: tabular-nums;
  }

  /* Day Toolbar & Filter Segmented Control */
  .day-toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 14px;
    flex-wrap: wrap;
  }

  .day-heading {
    font-size: 15px;
    font-weight: 600;
    letter-spacing: -0.015em;
    color: var(--text);
  }

  .filter-seg {
    display: inline-flex;
    align-items: center;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 3px;
    gap: 2px;
  }

  .seg-btn {
    border: none;
    background: transparent;
    color: var(--text-sec);
    font-family: inherit;
    font-size: 12px;
    font-weight: 600;
    padding: 5px 10px;
    border-radius: 7px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    transition: all 0.14s ease;
    font-variant-numeric: tabular-nums;
  }

  .seg-btn:hover {
    color: var(--text);
  }

  .seg-btn.active {
    background: #1d212d;
    color: var(--text);
    box-shadow: 0 1px 4px rgba(0, 0, 0, 0.3);
  }

  .seg-cnt {
    font-size: 11px;
    font-weight: 600;
    color: var(--text-muted);
  }

  .seg-btn.active .seg-cnt {
    color: var(--text-sec);
  }

  /* Section Dividers */
  .section-group {
    margin-bottom: 20px;
  }

  .section-hdr {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
    padding: 0 2px;
  }

  .section-title {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-sec);
  }

  .section-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
  }

  .section-dot.ready { background: var(--green); box-shadow: 0 0 8px var(--green); }
  .section-dot.placed { background: var(--sky); }
  .section-dot.watch { background: var(--amber); }

  .section-meta {
    font-size: 12px;
    font-weight: 500;
    color: var(--text-muted);
    font-variant-numeric: tabular-nums;
  }

  .quiet-notice {
    background: rgba(255, 255, 255, 0.02);
    border: 1px dashed rgba(255, 255, 255, 0.09);
    border-radius: 12px;
    padding: 11px 14px;
    margin-bottom: 18px;
    font-size: 12.5px;
    color: var(--text-sec);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    flex-wrap: wrap;
  }

  /* Bet Cards */
  .cards-stack {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .bet-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 16px 17px;
    transition: border-color 0.18s ease, transform 0.18s ease;
    box-shadow: 0 1px 0 rgba(255, 255, 255, 0.03) inset, 0 6px 20px rgba(0, 0, 0, 0.25);
  }

  .bet-card.stage-READY {
    border-color: rgba(16, 185, 129, 0.42);
    box-shadow: 0 0 0 1px rgba(16, 185, 129, 0.12), 0 8px 24px rgba(0, 0, 0, 0.35);
  }

  .bet-card.card-won {
    border-color: rgba(16, 185, 129, 0.38);
  }

  .bet-card.card-lost {
    border-color: rgba(244, 63, 94, 0.32);
  }

  /* Card Top Meta */
  .card-meta {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 10px;
  }

  .meta-left {
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 0;
  }

  .sport-pill {
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    padding: 2.5px 7px;
    border-radius: 6px;
    background: rgba(255, 255, 255, 0.06);
    color: #cbd5e1;
    flex-shrink: 0;
  }

  .matchup-txt {
    font-size: 12.5px;
    font-weight: 500;
    color: var(--text-sec);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .time-txt {
    font-size: 12px;
    font-weight: 500;
    color: var(--text-muted);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
    flex-shrink: 0;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }

  .time-txt.is-live {
    color: var(--green-bright);
    font-weight: 600;
  }

  /* Card Main Pick Row */
  .card-main {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 14px;
  }

  .pick-info {
    display: flex;
    flex-direction: column;
    gap: 3px;
    min-width: 0;
  }

  .pick-headline {
    font-size: 18px;
    font-weight: 700;
    letter-spacing: -0.02em;
    color: var(--text);
    line-height: 1.25;
  }

  .pick-sub {
    font-size: 12.5px;
    font-weight: 500;
    color: var(--text-muted);
  }

  .status-badge {
    font-size: 11.5px;
    font-weight: 600;
    padding: 4px 10px;
    border-radius: 99px;
    white-space: nowrap;
    flex-shrink: 0;
    font-variant-numeric: tabular-nums;
  }

  .badge-watch {
    background: var(--amber-soft);
    color: var(--amber-bright);
    border: 1px solid var(--amber-border);
  }

  .badge-ready {
    background: var(--green-soft);
    color: var(--green-bright);
    border: 1px solid var(--green-border);
  }

  .badge-placed {
    background: var(--sky-soft);
    color: var(--sky);
    border: 1px solid var(--sky-border);
  }

  .badge-won {
    background: var(--green-soft);
    color: var(--green-bright);
    border: 1px solid var(--green-border);
  }

  .badge-lost {
    background: var(--red-soft);
    color: var(--red-bright);
    border: 1px solid var(--red-border);
  }

  .badge-neutral {
    background: rgba(255, 255, 255, 0.06);
    color: var(--text-sec);
    border: 1px solid var(--border);
  }

  /* 3-Column Ticket Strip: Odds / Stake / To Win */
  .ticket-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    background: var(--inset);
    border: 1px solid rgba(255, 255, 255, 0.06);
    border-radius: 12px;
    overflow: hidden;
  }

  .t-col {
    padding: 11px 12px;
    display: flex;
    flex-direction: column;
    gap: 3px;
    min-width: 0;
  }

  .t-col + .t-col {
    border-left: 1px solid rgba(255, 255, 255, 0.06);
  }

  @media (min-width: 500px) {
    .t-col {
      padding: 12px 15px;
    }
  }

  .t-lbl {
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-muted);
    white-space: nowrap;
  }

  .t-val {
    font-size: 16.5px;
    font-weight: 700;
    letter-spacing: -0.02em;
    color: var(--text);
    font-variant-numeric: tabular-nums;
    line-height: 1.2;
    display: flex;
    align-items: baseline;
    gap: 5px;
    flex-wrap: wrap;
  }

  .t-val .dec-inline {
    font-size: 12px;
    font-weight: 500;
    color: var(--text-muted);
    letter-spacing: 0;
  }

  .t-val.pos { color: var(--green-bright); }
  .t-val.neg { color: var(--red-bright); }

  .t-sub {
    font-size: 11.5px;
    font-weight: 500;
    color: var(--text-sec);
    font-variant-numeric: tabular-nums;
    line-height: 1.3;
  }

  @media (max-width: 440px) {
    .hide-xs {
      display: none;
    }
  }

  .t-sub .edge-tag {
    color: var(--green-bright);
    font-weight: 600;
  }

  .t-sub .unit-strong {
    color: #cbd5e1;
    font-weight: 600;
  }

  .t-sub .unit-pos {
    color: #6ee7b7;
    font-weight: 600;
  }

  .t-sub .unit-neg {
    color: #fda4af;
    font-weight: 600;
  }

  /* Live / Post Game Tracker Strip (Hidden Pre-Game) */
  .live-tracker {
    margin-top: 12px;
    padding: 10px 12px;
    background: rgba(255, 255, 255, 0.025);
    border: 1px solid var(--border);
    border-radius: 10px;
    display: flex;
    flex-direction: column;
    gap: 7px;
  }

  .lt-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    font-size: 12.5px;
    font-variant-numeric: tabular-nums;
  }

  .lt-score {
    font-weight: 600;
    color: var(--text);
  }

  .lt-detail {
    font-weight: 500;
    color: var(--text-sec);
  }

  .lt-bar-track {
    width: 100%;
    height: 5px;
    background: rgba(255, 255, 255, 0.08);
    border-radius: 99px;
    overflow: hidden;
  }

  .lt-bar-fill {
    height: 100%;
    border-radius: 99px;
    transition: width 0.4s ease;
  }

  .lt-bar-fill.green, .lt-bar-fill.hit { background: var(--green); }
  .lt-bar-fill.yellow { background: var(--amber); }
  .lt-bar-fill.red { background: var(--red); }

  /* Plain-English Watchlist / Ready Explanation Box */
  .why-box {
    margin-top: 12px;
    padding: 11px 13px;
    border-radius: 11px;
    display: flex;
    flex-direction: column;
    gap: 5px;
  }

  .why-box.watch {
    background: rgba(245, 158, 11, 0.065);
    border: 1px solid rgba(245, 158, 11, 0.20);
  }

  .why-box.ready {
    background: rgba(16, 185, 129, 0.075);
    border: 1px solid rgba(16, 185, 129, 0.24);
  }

  .why-hdr {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    flex-wrap: wrap;
  }

  .why-title {
    font-size: 12px;
    font-weight: 600;
    color: #fde68a;
  }

  .why-box.ready .why-title {
    color: #6ee7b7;
  }

  .countdown-pill {
    font-size: 11px;
    font-weight: 600;
    color: var(--amber-bright);
    background: rgba(245, 158, 11, 0.14);
    padding: 2px 8px;
    border-radius: 99px;
    font-variant-numeric: tabular-nums;
  }

  .why-body {
    font-size: 12.5px;
    line-height: 1.48;
    color: #cbd5e1;
  }

  .line-check-foot {
    margin-top: 10px;
    padding-top: 9px;
    border-top: 1px solid rgba(255, 255, 255, 0.055);
    font-size: 11.5px;
    color: var(--text-muted);
    font-variant-numeric: tabular-nums;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    flex-wrap: wrap;
  }

  .why-box .line-check-foot {
    margin-top: 5px;
    padding-top: 7px;
  }

  /* Empty State & Skeletons */
  .empty-box {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 36px 22px;
    text-align: center;
  }

  .empty-title {
    font-size: 15px;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 6px;
  }

  .empty-sub {
    font-size: 13px;
    line-height: 1.5;
    color: var(--text-muted);
    max-width: 440px;
    margin: 0 auto;
  }

  .skel-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 18px;
    margin-bottom: 12px;
  }

  .skel-bar {
    height: 12px;
    border-radius: 6px;
    background: linear-gradient(90deg, rgba(255,255,255,0.04) 25%, rgba(255,255,255,0.09) 50%, rgba(255,255,255,0.04) 75%);
    background-size: 200% 100%;
    animation: skelShimmer 1.3s infinite linear;
  }

  @keyframes skelShimmer {
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }
</style>
</head>
<body>
<div class="wrap">
  <!-- Top Header -->
  <header class="topbar">
    <div class="brand-col">
      <div class="brand-row">
        <h1 class="brand-title">Singles Tracker</h1>
      </div>
      <div class="engine-status">
        <span class="pulse-dot syncing" id="sync-dot"></span>
        <span id="engine-status-text">Connecting to live scanner...</span>
      </div>
    </div>

    <div class="date-nav">
      <button class="date-step" id="date-prev" onclick="stepDate(-1)" aria-label="Previous day">&#8249;</button>
      <button class="date-trigger" id="date-trigger" onclick="toggleDateMenu(event)">
        <span id="date-label">Sat, Nov 14</span>
        <span class="chev">&#9662;</span>
      </button>
      <button class="date-step" id="date-next" onclick="stepDate(1)" aria-label="Next day">&#8250;</button>
    </div>

    <div class="date-dropdown" id="date-dropdown">
      <div class="cal-top">
        <span class="cal-month">November 2026</span>
        <span class="cal-net-pill" id="cal-total-chip">$0.00</span>
      </div>
      <div class="cal-weekdays">
        <span>Su</span><span>Mo</span><span>Tu</span><span>We</span><span>Th</span><span>Fr</span><span>Sa</span>
      </div>
      <div class="cal-grid" id="cal-grid"></div>
    </div>
  </header>

  <!-- Clean Performance Scoreboard -->
  <section class="scoreboard" id="scoreboard">
    <div class="sb-top">
      <div class="sb-profit-block">
        <span class="sb-eyebrow">Total Profit (1u = $15)</span>
        <div class="sb-hero-row">
          <span class="sb-hero-usd" id="sb-total-usd">$0.00</span>
          <span class="sb-unit-pill" id="sb-total-units">0.00u</span>
        </div>
      </div>
      <div class="sb-wallet-badge">
        <span class="sb-wallet-lbl">Available Balance</span>
        <span class="sb-wallet-val" id="sb-wallet-val">$215.09 (14.3u)</span>
      </div>
    </div>

    <div class="sb-stats-grid">
      <div class="sb-stat">
        <span class="sb-stat-lbl">Record</span>
        <span class="sb-stat-val" id="sb-record">0 - 0</span>
        <span class="sb-stat-sub" id="sb-record-sub">Wins - Losses</span>
      </div>
      <div class="sb-stat">
        <span class="sb-stat-lbl">Win Rate</span>
        <span class="sb-stat-val muted" id="sb-winrate">Pending</span>
        <span class="sb-stat-sub" id="sb-winrate-sub">No settled bets</span>
      </div>
      <div class="sb-stat">
        <span class="sb-stat-lbl">ROI</span>
        <span class="sb-stat-val muted" id="sb-roi">Pending</span>
        <span class="sb-stat-sub" id="sb-roi-sub">$0.00 settled</span>
      </div>
      <div class="sb-stat">
        <span class="sb-stat-lbl">Selected Day</span>
        <span class="sb-stat-val" id="sb-day-net">$0.00</span>
        <span class="sb-stat-sub" id="sb-day-sub">0 placed / 0 watch</span>
      </div>
    </div>
  </section>

  <!-- Day Filter & Cards -->
  <div class="day-toolbar">
    <h2 class="day-heading" id="day-heading">Saturday, Nov 14</h2>
    <div class="filter-seg" id="filter-seg">
      <button class="seg-btn active" onclick="setFilter('all')">All <span class="seg-cnt" id="cnt-all">0</span></button>
      <button class="seg-btn" onclick="setFilter('placed')">Placed <span class="seg-cnt" id="cnt-placed">0</span></button>
      <button class="seg-btn" onclick="setFilter('watchlist')">Watchlist <span class="seg-cnt" id="cnt-watch">0</span></button>
    </div>
  </div>

  <main id="content"></main>
</div>

<script>
function getInitialEstDate() {
  try {
    const est = new Date().toLocaleDateString('en-CA', { timeZone: 'America/New_York' });
    if (est >= '2026-11-14') return est;
  } catch (e) {}
  return '2026-11-14';
}

let activeDate = getInitialEstDate();
let activeFilter = 'all';
let dataStore = null;
const dateCache = {};
let prefetchedAll = false;
let fetchSeq = 0;
let clockSkewMs = 0;
let usedStaticSource = location.hostname.endsWith('github.io');

const DATE_LABELS = {
  '2026-11-14': 'Sat, Nov 14',
};

const DATE_FULL_LABELS = {
  '2026-11-14': 'Saturday, Nov 14',
};

function fmtSignedUsd(val) {
  const n = Number(val || 0);
  if (Math.abs(n) < 0.005) return '$0.00';
  return (n > 0 ? '+$' : '-$') + Math.abs(n).toFixed(2);
}

function fmtSignedUnits(val) {
  const n = Number(val || 0);
  if (Math.abs(n) < 0.005) return '0.00u';
  return (n > 0 ? '+' : '-') + Math.abs(n).toFixed(2) + 'u';
}

function decToAmer(decVal) {
  const d = Number(decVal || 0);
  if (d >= 2.0) return '+' + Math.round((d - 1.0) * 100);
  if (d > 1.005) return '-' + Math.round(100 / (d - 1.0));
  return '-110';
}

function fmtDurationShort(ms) {
  const totalSec = Math.max(0, Math.floor(ms / 1000));
  if (totalSec < 60) return totalSec + 's';
  const mins = Math.floor(totalSec / 60);
  const secs = totalSec % 60;
  if (mins < 60) return secs > 0 ? `${mins}m ${secs}s` : `${mins}m`;
  const hrs = Math.floor(mins / 60);
  const remM = mins % 60;
  return remM > 0 ? `${hrs}h ${remM}m` : `${hrs}h`;
}

function renderSkeletons() {
  const el = document.getElementById('content');
  if (!el) return;
  el.innerHTML = [1, 2].map(() => `
    <div class="skel-card">
      <div class="skel-bar" style="width: 38%; margin-bottom: 12px;"></div>
      <div class="skel-bar" style="width: 64%; height: 18px; margin-bottom: 16px;"></div>
      <div class="skel-bar" style="width: 100%; height: 54px; border-radius: 10px;"></div>
    </div>
  `).join('');
}

function toggleDateMenu(e) {
  if (e) e.stopPropagation();
  const dd = document.getElementById('date-dropdown');
  const tr = document.getElementById('date-trigger');
  if (!dd || !tr) return;
  const open = dd.classList.toggle('show');
  tr.classList.toggle('open', open);
}

document.addEventListener('click', (e) => {
  const dd = document.getElementById('date-dropdown');
  const tr = document.getElementById('date-trigger');
  if (dd && dd.classList.contains('show') && !dd.contains(e.target) && (!tr || !tr.contains(e.target))) {
    dd.classList.remove('show');
    if (tr) tr.classList.remove('open');
  }
});

function setFilter(f) {
  activeFilter = f;
  render();
}

function selectDate(dt) {
  if (!dt) return;
  activeDate = dt;
  const dd = document.getElementById('date-dropdown');
  const tr = document.getElementById('date-trigger');
  if (dd) dd.classList.remove('show');
  if (tr) tr.classList.remove('open');
  if (dateCache[dt]) {
    dataStore = dateCache[dt];
    render();
    if (!dataStore.settled_permanent) fetchLive(false);
    return;
  }
  renderSkeletons();
  fetchLive(true);
}

function stepDate(dir) {
  const avail = (dataStore && dataStore.available_dates)
    ? dataStore.available_dates.map(d => d.date)
    : Object.keys(DATE_LABELS);
  const idx = avail.indexOf(activeDate);
  const nextIdx = idx + dir;
  if (nextIdx >= 0 && nextIdx < avail.length) {
    selectDate(avail[nextIdx]);
  }
}

function isLegSettled(l) {
  if (!l) return true;
  if (l.is_void || String(l.badge || '').includes('Void') || String(l.badge || '').includes('Push')) return true;
  if (l.game_state === 'post') return true;
  if (l.status === 'red' && l.raw_side === 'U') return true;
  return false;
}

function updateLiveTickers() {
  // 1. Update scanner heartbeat status text
  const stEl = document.getElementById('engine-status-text');
  if (stEl && dataStore) {
    const hb = dataStore.engine_heartbeat || {};
    const intervalMin = Math.max(1, Math.round(Number(hb.scan_interval_sec || 120) / 60));
    const eventsCnt = Number(hb.pinnacle_events || 0);
    const gamesSuffix = eventsCnt > 0 ? ` · ${eventsCnt} games monitored` : '';
    if (usedStaticSource) {
      const syncTime = hb.last_scan_est || dataStore.updated_at || '';
      stEl.innerText = `Live scores active · Scans every ${intervalMin}m${syncTime ? ' (Synced ' + syncTime + ')' : ''}`;
    } else if (hb.last_scan_epoch_ms) {
      const nowAdj = Date.now() + clockSkewMs;
      const ageMs = Math.max(0, nowAdj - Number(hb.last_scan_epoch_ms));
      const ageTxt = ageMs < 5000 ? 'just now' : `${fmtDurationShort(ageMs)} ago`;
      stEl.innerText = `Checked ${ageTxt} · Scans every ${intervalMin}m${gamesSuffix}`;
    } else {
      stEl.innerText = `Scanner active · Scans every ${intervalMin}m`;
    }
  }

  // 2. Update Watchlist countdown pills
  const pills = document.querySelectorAll('[data-release-ms]');
  const nowMs = Date.now() + clockSkewMs;
  pills.forEach(el => {
    const targetMs = Number(el.getAttribute('data-release-ms') || 0);
    if (!targetMs) return;
    const diff = targetMs - nowMs;
    if (diff <= 0) {
      el.innerText = 'Checking live line now...';
    } else {
      el.innerText = 'Checks in ' + fmtDurationShort(diff);
    }
  });
}

function renderBetCard(l) {
  const stage = l.bet_stage || 'WATCHLIST';
  const isLive = l.game_state === 'in';
  const isPost = l.game_state === 'post';
  const settled = isLegSettled(l);

  const sportTag = l.sport_short || l.raw_sport || 'SPORT';
  const matchupTxt = l.matchup_clean || (l.team ? String(l.team).split('•').pop().trim() : l.game_score);
  const headline = l.pick_headline || l.player || 'Single Pick';
  const marketSub = l.market_subtitle || 'Full Game';

  const effOdds = Number(l.raw_odds || l.sniper_badges?.eff_odds || 1.91);
  const amerOdds = l.amer_odds || l.sniper_badges?.amer_odds || decToAmer(effOdds);
  const decStr = l.dec_odds_fmt || (effOdds.toFixed(2) + 'x');
  const stakeUsd = Number(l.stake ?? 9.0);
  const stakeUnits = Number(l.stake_units ?? (stakeUsd / 15.0));
  const payoutUsd = Number(l.exact_payout ?? (stakeUsd * effOdds));
  const toWinUsd = Number(l.to_win_usd ?? Math.max(0, payoutUsd - stakeUsd));
  const toWinUnits = Number(l.to_win_units ?? (toWinUsd / 15.0));
  const edgePct = Number(l.sniper_badges?.net_ev_pct || 0);
  const fairPct = Number(l.sniper_badges?.pinn_fair_pct || 0);
  const fairAmer = l.fair_amer_odds || l.sniper_badges?.fair_amer_odds || '';

  // Time / Clock top-right
  let timeHtml = '';
  if (isLive) {
    timeHtml = `<span class="time-txt is-live"><span class="pulse-dot" style="width:6px;height:6px;"></span>${l.game_clock || 'LIVE'}</span>`;
  } else if (isPost) {
    timeHtml = `<span class="time-txt">Final</span>`;
  } else {
    const cleanStart = String(l.start_label || l.game_clock || 'Scheduled').replace(/^Starts\s+/i, '');
    timeHtml = `<span class="time-txt">${cleanStart}</span>`;
  }

  // Status badge & card state class
  let badgeCls = 'badge-watch';
  let badgeTxt = 'Watchlist';
  let cardExtraCls = `stage-${stage}`;

  if (stage === 'WATCHLIST') {
    badgeCls = 'badge-watch';
    badgeTxt = l.release_time_est ? `Watchlist · ${l.release_time_est.replace(' EST', '')}` : 'Watchlist';
  } else if (stage === 'READY') {
    badgeCls = 'badge-ready';
    badgeTxt = 'Ready to Bet';
  } else {
    if (l.is_void) {
      badgeCls = 'badge-neutral';
      badgeTxt = 'Push ($0)';
    } else if (l.status === 'hit' && settled) {
      badgeCls = 'badge-won';
      badgeTxt = `Won +${toWinUnits.toFixed(2)}u`;
      cardExtraCls += ' card-won';
    } else if (l.status === 'red' && settled) {
      badgeCls = 'badge-lost';
      badgeTxt = `Lost -${stakeUnits.toFixed(2)}u`;
      cardExtraCls += ' card-lost';
    } else if (isLive) {
      badgeCls = l.status === 'green' || l.status === 'hit' ? 'badge-won' : 'badge-watch';
      badgeTxt = l.badge || 'Live';
    } else {
      badgeCls = 'badge-placed';
      badgeTxt = 'Placed';
    }
  }

  // Column 2 & Column 3 labels and values
  const stakeLabel = stage === 'PLACED' ? 'Risked' : 'Stake';
  let col3Lbl = 'To Win';
  let col3Val = `+$${toWinUsd.toFixed(2)}`;
  let col3ValCls = 'pos';
  let col3Sub = `<span class="unit-pos">+${toWinUnits.toFixed(2)} units</span><span class="hide-xs"> · $${payoutUsd.toFixed(2)} ret</span>`;

  if (stage === 'PLACED' && settled) {
    col3Lbl = 'Result';
    if (l.is_void) {
      col3Val = '$0.00';
      col3ValCls = '';
      col3Sub = '0.00u refunded';
    } else if (l.status === 'hit') {
      col3Val = `+$${toWinUsd.toFixed(2)}`;
      col3ValCls = 'pos';
      col3Sub = `<span class="unit-pos">+${toWinUnits.toFixed(2)}u won</span>`;
    } else {
      col3Val = `-$${stakeUsd.toFixed(2)}`;
      col3ValCls = 'neg';
      col3Sub = `<span class="unit-neg">-${stakeUnits.toFixed(2)}u lost</span>`;
    }
  }

  // Live or Final score tracker (Hidden pre-game so there is zero clutter)
  let liveTrackerHtml = '';
  if (isLive || isPost) {
    const pctNum = Math.min(100, Math.max(6, Number(l.pct || 50)));
    const barHtml = isLive ? `
      <div class="lt-bar-track">
        <div class="lt-bar-fill ${l.status || 'green'}" style="width: ${pctNum}%"></div>
      </div>
    ` : '';
    liveTrackerHtml = `
      <div class="live-tracker">
        <div class="lt-row">
          <span class="lt-score">${l.game_score || matchupTxt}</span>
          <span class="lt-detail">${l.sub_stat || ''}</span>
        </div>
        ${barHtml}
      </div>
    `;
  }

  // Plain-English explanation box (Watchlist / Ready / Placed)
  let footerHtml = '';
  const lineCheckStr = fairPct > 0
    ? `Overtime ${amerOdds} (${decStr}) vs Sharp fair line ${fairAmer} (${fairPct.toFixed(1)}% win chance)`
    : `Overtime ${amerOdds} (${decStr})`;

  if (stage === 'WATCHLIST') {
    const cdAttr = l.release_epoch_ms ? `data-release-ms="${l.release_epoch_ms}"` : '';
    const cdHtml = l.release_epoch_ms ? `<span class="countdown-pill" ${cdAttr}>Calculating...</span>` : '';
    footerHtml = `
      <div class="why-box watch">
        <div class="why-hdr">
          <span class="why-title">${l.why_title || 'Why this is on the Watchlist'}</span>
          ${cdHtml}
        </div>
        <p class="why-body">${l.why_body || ''}</p>
        <div class="line-check-foot">
          <span>${lineCheckStr}</span>
        </div>
      </div>
    `;
  } else if (stage === 'READY') {
    footerHtml = `
      <div class="why-box ready">
        <div class="why-hdr">
          <span class="why-title">${l.why_title || 'Ready to Place Now'}</span>
        </div>
        <p class="why-body">${l.why_body || ''}</p>
        <div class="line-check-foot">
          <span>${lineCheckStr}</span>
        </div>
      </div>
    `;
  } else {
    footerHtml = `
      <div class="line-check-foot">
        <span>${lineCheckStr}</span>
        ${edgePct > 0 ? `<span style="color: var(--green-bright); font-weight: 600;">+${edgePct.toFixed(1)}% edge at entry</span>` : ''}
      </div>
    `;
  }

  const edgeSub = edgePct > 0
    ? `<span class="edge-tag">+${edgePct.toFixed(1)}% edge</span>`
    : `Decimal ${decStr}`;

  return `
    <article class="bet-card ${cardExtraCls}">
      <div class="card-meta">
        <div class="meta-left">
          <span class="sport-pill">${sportTag}</span>
          <span class="matchup-txt">${matchupTxt}</span>
        </div>
        ${timeHtml}
      </div>

      <div class="card-main">
        <div class="pick-info">
          <h3 class="pick-headline">${headline}</h3>
          <span class="pick-sub">${marketSub}</span>
        </div>
        <span class="status-badge ${badgeCls}">${badgeTxt}</span>
      </div>

      <div class="ticket-grid">
        <div class="t-col">
          <span class="t-lbl">Odds</span>
          <span class="t-val">${amerOdds}<span class="dec-inline">${decStr}</span></span>
          <span class="t-sub">${edgeSub}</span>
        </div>
        <div class="t-col">
          <span class="t-lbl">${stakeLabel}</span>
          <span class="t-val">$${stakeUsd.toFixed(2)}</span>
          <span class="t-sub"><span class="unit-strong">${stakeUnits.toFixed(2)} units</span></span>
        </div>
        <div class="t-col">
          <span class="t-lbl">${col3Lbl}</span>
          <span class="t-val ${col3ValCls}">${col3Val}</span>
          <span class="t-sub">${col3Sub}</span>
        </div>
      </div>

      ${liveTrackerHtml}
      ${footerHtml}
    </article>
  `;
}

function render() {
  if (!dataStore) return;

  // 1. Update Date Selector & Calendar
  if (Array.isArray(dataStore.available_dates)) {
    const dates = dataStore.available_dates;
    const idx = dates.findIndex(d => d.date === activeDate);
    const curObj = idx >= 0 ? dates[idx] : dates[dates.length - 1];
    dates.forEach(d => {
      if (d.short_label) DATE_LABELS[d.date] = d.short_label;
      if (d.full_label) DATE_FULL_LABELS[d.date] = d.full_label.replace(/,\s*\d{4}$/, '');
    });

    const lblEl = document.getElementById('date-label');
    if (lblEl && curObj) lblEl.innerText = curObj.short_label || activeDate;
    const dayHdr = document.getElementById('day-heading');
    if (dayHdr) dayHdr.innerText = DATE_FULL_LABELS[activeDate] || DATE_LABELS[activeDate] || activeDate;

    const prevBtn = document.getElementById('date-prev');
    const nextBtn = document.getElementById('date-next');
    if (prevBtn) prevBtn.classList.toggle('disabled', idx <= 0);
    if (nextBtn) nextBtn.classList.toggle('disabled', idx < 0 || idx >= dates.length - 1);

    const gridEl = document.getElementById('cal-grid');
    if (gridEl) {
      const availMap = {};
      let calTotal = 0;
      dates.forEach(d => {
        const cachedNet = (dateCache[d.date] && dateCache[d.date].day_net !== undefined)
          ? Number(dateCache[d.date].day_net)
          : Number(d.net ?? 0);
        availMap[d.date] = cachedNet;
        calTotal += cachedNet;
      });
      const totChip = document.getElementById('cal-total-chip');
      if (totChip) {
        totChip.innerText = fmtSignedUsd(calTotal);
        totChip.className = 'cal-net-pill' + (calTotal > 0.005 ? ' pos' : (calTotal < -0.005 ? ' neg' : ''));
      }
      let cells = '';
      for (let day = 1; day <= 30; day++) {
        const dtStr = '2026-11-' + String(day).padStart(2, '0');
        if (!Object.prototype.hasOwnProperty.call(availMap, dtStr)) {
          cells += `<button class="cal-day disabled"><span>${day}</span></button>`;
        } else {
          const dNet = Number(availMap[dtStr] || 0);
          const isAct = dtStr === activeDate;
          let cls = 'cal-day';
          let sub = '$0';
          if (dNet > 0.005) {
            cls += ' pnl-pos';
            sub = '+$' + Math.round(dNet);
          } else if (dNet < -0.005) {
            cls += ' pnl-neg';
            sub = '-$' + Math.round(Math.abs(dNet));
          } else {
            cls += ' pnl-today';
            sub = 'Today';
          }
          if (isAct) cls += ' active';
          cells += `<button class="${cls}" onclick="selectDate('${dtStr}')"><span>${day}</span><span class="cal-day-pnl">${sub}</span></button>`;
        }
      }
      gridEl.innerHTML = cells;
    }
  }

  // 2. Gather All Legs for Selected Date
  const allLegs = [];
  (dataStore.parlays || []).forEach(grp => {
    (grp.legs || []).forEach(l => allLegs.push(l));
  });

  const readyLegs = allLegs.filter(l => l.bet_stage === 'READY');
  const placedLegs = allLegs.filter(l => l.bet_stage === 'PLACED');
  const watchLegs = allLegs.filter(l => (l.bet_stage || 'WATCHLIST') === 'WATCHLIST');

  // 3. Update Scoreboard
  const sb = dataStore.scoreboard || {};
  const sm = dataStore.sniper_meta || {};
  const totUsd = Number(sb.total_net_usd ?? dataStore.day_net ?? 0);
  const totUnits = Number(sb.total_net_units ?? (totUsd / 15.0));
  const wins = Number(sb.total_wins ?? 0);
  const losses = Number(sb.total_losses ?? 0);
  const pushes = Number(sb.total_pushes ?? 0);
  const settledCnt = wins + losses;
  const winRate = sb.win_rate_pct;
  const roiPct = sb.roi_pct;
  const walletUsd = Number(sb.wallet_balance_usd ?? sm.onchain_usdc_usd ?? 215.09);
  const walletU = Number(sb.wallet_balance_units ?? sm.onchain_units ?? 14.34);

  const elTotUsd = document.getElementById('sb-total-usd');
  const elTotU = document.getElementById('sb-total-units');
  if (elTotUsd) {
    elTotUsd.innerText = fmtSignedUsd(totUsd);
    elTotUsd.className = 'sb-hero-usd' + (totUsd > 0.005 ? ' pos' : (totUsd < -0.005 ? ' neg' : ''));
  }
  if (elTotU) {
    elTotU.innerText = fmtSignedUnits(totUnits);
    elTotU.className = 'sb-unit-pill' + (totUnits > 0.005 ? ' pos' : (totUnits < -0.005 ? ' neg' : ''));
  }

  const elWallet = document.getElementById('sb-wallet-val');
  if (elWallet) {
    elWallet.innerText = `$${walletUsd.toFixed(2)} (${walletU.toFixed(1)}u)`;
  }

  const elRec = document.getElementById('sb-record');
  const elRecSub = document.getElementById('sb-record-sub');
  if (elRec) {
    elRec.innerText = pushes > 0 ? `${wins} - ${losses} - ${pushes}` : `${wins} - ${losses}`;
  }
  if (elRecSub) {
    const openCnt = Number(sb.day_open || 0);
    elRecSub.innerText = openCnt > 0 ? `${openCnt} in play` : (settledCnt > 0 ? `${settledCnt} settled` : 'Fresh start');
  }

  const elWr = document.getElementById('sb-winrate');
  const elWrSub = document.getElementById('sb-winrate-sub');
  if (elWr) {
    if (winRate === null || winRate === undefined || settledCnt === 0) {
      elWr.innerText = 'Pending';
      elWr.className = 'sb-stat-val muted';
      if (elWrSub) elWrSub.innerText = 'No settled bets';
    } else {
      elWr.innerText = `${Number(winRate).toFixed(1)}%`;
      elWr.className = 'sb-stat-val' + (Number(winRate) >= 54 ? ' pos' : '');
      if (elWrSub) elWrSub.innerText = `${wins} of ${settledCnt} won`;
    }
  }

  const elRoi = document.getElementById('sb-roi');
  const elRoiSub = document.getElementById('sb-roi-sub');
  if (elRoi) {
    const settledRisk = Number(sb.total_settled_risk_usd || 0);
    if (roiPct === null || roiPct === undefined || settledRisk <= 0) {
      elRoi.innerText = 'Pending';
      elRoi.className = 'sb-stat-val muted';
      if (elRoiSub) elRoiSub.innerText = '$0.00 settled';
    } else {
      const rNum = Number(roiPct);
      elRoi.innerText = (rNum >= 0 ? '+' : '') + rNum.toFixed(1) + '%';
      elRoi.className = 'sb-stat-val' + (rNum > 0.05 ? ' pos' : (rNum < -0.05 ? ' neg' : ''));
      if (elRoiSub) elRoiSub.innerText = `On $${settledRisk.toFixed(0)} risked`;
    }
  }

  const dayUsd = Number(sb.day_net_usd ?? dataStore.day_net ?? 0);
  const dayU = Number(sb.day_net_units ?? (dayUsd / 15.0));
  const elDayNet = document.getElementById('sb-day-net');
  const elDaySub = document.getElementById('sb-day-sub');
  if (elDayNet) {
    elDayNet.innerText = placedLegs.length > 0 ? `${fmtSignedUsd(dayUsd)} (${fmtSignedUnits(dayU)})` : '$0.00';
    elDayNet.className = 'sb-stat-val' + (dayUsd > 0.005 ? ' pos' : (dayUsd < -0.005 ? ' neg' : ''));
  }
  if (elDaySub) {
    const pCnt = placedLegs.length + readyLegs.length;
    elDaySub.innerText = `${placedLegs.length} placed · ${watchLegs.length} watch`;
  }

  // 4. Update Filter Pill Counts & Active State
  const cntAll = document.getElementById('cnt-all');
  const cntPlaced = document.getElementById('cnt-placed');
  const cntWatch = document.getElementById('cnt-watch');
  if (cntAll) cntAll.innerText = String(allLegs.length);
  if (cntPlaced) cntPlaced.innerText = String(placedLegs.length + readyLegs.length);
  if (cntWatch) cntWatch.innerText = String(watchLegs.length);

  const btns = document.querySelectorAll('#filter-seg .seg-btn');
  const filterOrder = ['all', 'placed', 'watchlist'];
  btns.forEach((b, i) => {
    b.classList.toggle('active', filterOrder[i] === activeFilter);
  });

  // 5. Render Cards List
  const container = document.getElementById('content');
  if (!container) return;

  if (allLegs.length === 0) {
    container.innerHTML = `
      <div class="empty-box">
        <div class="empty-title">No Picks or Watchlist Plays Right Now</div>
        <p class="empty-sub">The scanner checks live Pinnacle vs Overtime odds every 2 minutes across NBA, College Basketball, NHL, Football, Tennis, and Soccer. Plays appear here automatically as soon as an edge shows up.</p>
      </div>
    `;
    updateLiveTickers();
    return;
  }

  let html = '';

  if (activeFilter === 'placed') {
    const list = [...readyLegs, ...placedLegs];
    if (list.length === 0) {
      html = `
        <div class="empty-box">
          <div class="empty-title">No Bets Placed Yet on ${DATE_LABELS[activeDate] || activeDate}</div>
          <p class="empty-sub">${watchLegs.length > 0 ? `We are holding ${watchLegs.length} pick${watchLegs.length === 1 ? '' : 's'} on the Watchlist until closer to start time.` : 'No bets have triggered yet today.'}</p>
        </div>
      `;
    } else {
      html = `<div class="cards-stack">${list.map(renderBetCard).join('')}</div>`;
    }
  } else if (activeFilter === 'watchlist') {
    if (watchLegs.length === 0) {
      html = `
        <div class="empty-box">
          <div class="empty-title">Watchlist Is Empty</div>
          <p class="empty-sub">No upcoming picks are waiting right now. The scanner checks for new edges every 2 minutes.</p>
        </div>
      `;
    } else {
      html = `<div class="cards-stack">${watchLegs.map(renderBetCard).join('')}</div>`;
    }
  } else {
    // 'all' view: Ready -> Placed -> Watchlist
    if (readyLegs.length > 0) {
      html += `
        <section class="section-group">
          <div class="section-hdr">
            <span class="section-title"><span class="section-dot ready"></span>Ready to Place Now (${readyLegs.length})</span>
            <span class="section-meta">Action ready</span>
          </div>
          <div class="cards-stack">${readyLegs.map(renderBetCard).join('')}</div>
        </section>
      `;
    }

    if (placedLegs.length > 0) {
      const riskedToday = placedLegs.reduce((acc, x) => acc + Number(x.stake || 0), 0);
      html += `
        <section class="section-group">
          <div class="section-hdr">
            <span class="section-title"><span class="section-dot placed"></span>Placed Bets (${placedLegs.length})</span>
            <span class="section-meta">$${riskedToday.toFixed(2)} risked (${(riskedToday / 15.0).toFixed(2)}u)</span>
          </div>
          <div class="cards-stack">${placedLegs.map(renderBetCard).join('')}</div>
        </section>
      `;
    } else if (readyLegs.length === 0 && watchLegs.length > 0) {
      html += `
        <div class="quiet-notice">
          <span>No bets placed yet today ($0.00 risked)</span>
          <span style="color: var(--amber-bright); font-weight: 600;">${watchLegs.length} waiting on Watchlist below</span>
        </div>
      `;
    }

    if (watchLegs.length > 0) {
      const plannedSum = watchLegs.reduce((acc, x) => acc + Number(x.stake || 0), 0);
      html += `
        <section class="section-group">
          <div class="section-hdr">
            <span class="section-title"><span class="section-dot watch"></span>Watchlist (${watchLegs.length})</span>
            <span class="section-meta">Not bet yet · $${plannedSum.toFixed(2)} (${(plannedSum / 15.0).toFixed(2)}u) planned</span>
          </div>
          <div class="cards-stack">${watchLegs.map(renderBetCard).join('')}</div>
        </section>
      `;
    }
  }

  container.innerHTML = html;
  updateLiveTickers();
}

const ESPN_SPORT_PATH = {
  NBA: 'basketball/nba',
  NHL: 'hockey/nhl',
  NFL: 'football/nfl',
  NCAAF: 'football/college-football',
  NCAAB: 'basketball/mens-college-basketball',
  ATP: 'tennis/atp',
  WTA: 'tennis/wta',
};

const TEAM_ALIAS = {
  WAS: 'WSH', WSH: 'WSH',
  GSW: 'GS', GS: 'GS',
  NOP: 'NO', NO: 'NO',
  NYK: 'NY', NY: 'NY',
  SAS: 'SA', SA: 'SA',
  UTA: 'UTAH', UTAH: 'UTAH',
  TBL: 'TB', TB: 'TB',
  NJD: 'NJ', NJ: 'NJ',
  LAK: 'LA', LA: 'LA',
  SJS: 'SJ', SJ: 'SJ',
};

function normTeam(sp, abbr) {
  const u = String(abbr || '').toUpperCase().trim();
  if (sp === 'NHL' && u === 'VGK') return 'VGK';
  return TEAM_ALIAS[u] || u;
}

function normPlayerName(s) {
  return String(s || '')
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .toLowerCase()
    .replace(/[^a-z0-9 ]/g, '')
    .replace(/\b(jr|sr|ii|iii|iv)\b/g, '')
    .replace(/\s+/g, ' ')
    .trim();
}

async function updateLiveFromESPNInBrowser(payloadObj) {
  if (!payloadObj || payloadObj.settled_permanent || !Array.isArray(payloadObj.parlays)) {
    return payloadObj;
  }
  const dt = payloadObj.current_date || activeDate;
  const ymd = dt.replace(/-/g, '');
  const allLegs = [];
  payloadObj.parlays.forEach(p => (p.legs || []).forEach(l => allLegs.push(l)));
  const sportsNeeded = [...new Set(allLegs.map(l => l.raw_sport).filter(sp => ESPN_SPORT_PATH[sp]))];

  const gameMap = {};
  for (const sp of sportsNeeded) {
    try {
      const q = sp === 'NCAAB' ? `&groups=50&limit=400` : '';
      const sbUrl = `https://site.api.espn.com/apis/site/v2/sports/${ESPN_SPORT_PATH[sp]}/scoreboard?dates=${ymd}${q}&t=${Date.now()}`;
      const sbRes = await fetch(sbUrl);
      if (!sbRes.ok) continue;
      const sbJson = await sbRes.json();
      for (const ev of (sbJson.events || [])) {
        const comp = (ev.competitions || [])[0];
        if (!comp) continue;
        const stObj = comp.status || ev.status || {};
        const stType = stObj.type || {};
        const state = stType.state || 'pre';
        const shortDetail = stType.shortDetail || '';
        const competitors = comp.competitors || [];
        const home = competitors.find(c => c.homeAway === 'home') || competitors[0];
        const away = competitors.find(c => c.homeAway === 'away') || competitors[1];
        if (!home || !away) continue;
        const hAbbr = normTeam(sp, home.team?.abbreviation);
        const aAbbr = normTeam(sp, away.team?.abbreviation);
        const hName = home.team?.displayName || hAbbr;
        const aName = away.team?.displayName || aAbbr;
        const hScore = Number(home.score || 0);
        const aScore = Number(away.score || 0);
        const scoreStr = state === 'pre' ? `${aName} @ ${hName}` : `${aName} ${aScore} - ${hScore} ${hName}`;
        const clockLbl = state === 'post' ? 'Final' : (state === 'pre' ? `Starts ${shortDetail.split(' - ').pop()}` : shortDetail);
        gameMap[`ID_${ev.id}_HOME`] = { state, clock: clockLbl, scoreStr, ts: hScore, os: aScore, tot: hScore + aScore };
        gameMap[`ID_${ev.id}_AWAY`] = { state, clock: clockLbl, scoreStr, ts: aScore, os: hScore, tot: hScore + aScore };
        gameMap[`${sp}_${hAbbr}`] = { state, clock: clockLbl, scoreStr, ts: hScore, os: aScore, tot: hScore + aScore };
        gameMap[`${sp}_${aAbbr}`] = { state, clock: clockLbl, scoreStr, ts: aScore, os: hScore, tot: hScore + aScore };
      }
    } catch (e) {}
  }

  let placedNet = 0;
  let placedRisk = 0;
  let placedSettledRisk = 0;
  let pw = 0, pl = 0, pp = 0, pOpen = 0;

  for (const p of payloadObj.parlays) {
    for (const l of (p.legs || [])) {
      const sp = l.raw_sport;
      const tm = normTeam(sp, l.raw_team);
      const idKey = l.espn_event_id ? `ID_${l.espn_event_id}_${l.side_tag === 'AWAY' ? 'AWAY' : 'HOME'}` : '';
      const gInfo = (idKey && gameMap[idKey]) ? gameMap[idKey] : gameMap[`${sp}_${tm}`];
      if (gInfo) {
        l.game_state = gInfo.state;
        if (gInfo.state !== 'pre' || !l.start_label) l.game_clock = gInfo.clock;
        l.game_score = gInfo.scoreStr;
        if (l.raw_market === 'SP' && gInfo.state !== 'pre') {
          const ln = Number(l.raw_line || 0);
          const lnFmt = (ln >= 0 ? '+' : '') + ln.toFixed(1);
          const cov = (gInfo.ts - gInfo.os) + ln;
          if (gInfo.state === 'post') {
            if (cov > 0) {
              l.status = 'hit'; l.badge = 'Covered'; l.pct = 100; l.sub_stat = `Covered ${lnFmt}`;
            } else if (Math.abs(cov) < 1e-6) {
              l.status = 'yellow'; l.badge = 'Push'; l.is_void = true; l.pct = 100; l.sub_stat = `Push ${lnFmt}`;
            } else {
              l.status = 'red'; l.badge = 'Missed'; l.pct = 0; l.sub_stat = `Missed ${lnFmt}`;
            }
          } else {
            const covFmt = (cov >= 0 ? '+' : '') + cov.toFixed(1);
            l.status = cov > 0 ? 'green' : 'yellow';
            l.badge = cov > 0 ? `Covering (${covFmt})` : `Behind (${covFmt})`;
            l.pct = cov > 0 ? 75 : 35;
            l.sub_stat = `Margin ${covFmt} on ${lnFmt}`;
          }
        }
      }

      if (l.bet_stage === 'PLACED') {
        const st = Number(l.stake || 0);
        const pay = Number(l.exact_payout || st);
        placedRisk += st;
        if (l.is_void) {
          pp++;
        } else if (l.status === 'hit' && isLegSettled(l)) {
          placedNet += (pay - st);
          placedSettledRisk += st;
          pw++;
        } else if (l.status === 'red' && isLegSettled(l)) {
          placedNet -= st;
          placedSettledRisk += st;
          pl++;
        } else {
          pOpen++;
        }
      }
    }
  }

  payloadObj.day_risk = Math.round(placedRisk * 100) / 100;
  payloadObj.day_net = Math.round(placedNet * 100) / 100;
  if (payloadObj.scoreboard) {
    payloadObj.scoreboard.day_net_usd = payloadObj.day_net;
    payloadObj.scoreboard.day_net_units = Math.round((payloadObj.day_net / 15.0) * 100) / 100;
    payloadObj.scoreboard.day_wins = pw;
    payloadObj.scoreboard.day_losses = pl;
    payloadObj.scoreboard.day_pushes = pp;
    payloadObj.scoreboard.day_open = pOpen;
  }
  return payloadObj;
}

async function fetchDateJson(dt) {
  let json = null;
  const isGh = location.hostname.endsWith('github.io');
  usedStaticSource = isGh;
  if (!isGh) {
    try {
      const res = await fetch('/api/live?date=' + encodeURIComponent(dt) + '&t=' + Date.now());
      if (res.ok && (res.headers.get('content-type') || '').includes('json')) {
        json = await res.json();
        if (json && json.server_epoch_ms) {
          clockSkewMs = Number(json.server_epoch_ms) - Date.now();
        }
      }
    } catch (e) {
      usedStaticSource = true;
    }
  }
  if (!json) {
    usedStaticSource = true;
    let res2 = await fetch('api/live-' + encodeURIComponent(dt) + '.json?t=' + Date.now());
    if (!res2.ok && dt !== '2026-11-14') {
      activeDate = '2026-11-14';
      res2 = await fetch('api/live-2026-11-14.json?t=' + Date.now());
    }
    json = await res2.json();
  }
  if (json && !json.settled_permanent && usedStaticSource) {
    await updateLiveFromESPNInBrowser(json);
  }
  return json;
}

async function prefetchAllDates() {
  if (prefetchedAll) return;
  prefetchedAll = true;
  const dates = (dataStore && dataStore.available_dates)
    ? dataStore.available_dates.map(d => d.date)
    : Object.keys(DATE_LABELS);
  for (const dt of dates) {
    if (dateCache[dt]) continue;
    try {
      const json = await fetchDateJson(dt);
      if (json && json.parlays) dateCache[dt] = json;
    } catch (e) {}
  }
}

async function fetchLive(isManual) {
  const reqDt = activeDate;
  if (!isManual && dateCache[reqDt] && dateCache[reqDt].settled_permanent) return;
  const mySeq = ++fetchSeq;
  const dot = document.getElementById('sync-dot');
  if (dot && !dateCache[reqDt]) dot.classList.add('syncing');
  try {
    const json = await fetchDateJson(reqDt);
    if (json && json.parlays) dateCache[reqDt] = json;
    if (mySeq !== fetchSeq || activeDate !== reqDt) return;
    dataStore = json;
    render();
    prefetchAllDates();
  } catch (e) {
    const stEl = document.getElementById('engine-status-text');
    if (mySeq === fetchSeq && stEl && !dataStore) stEl.innerText = 'Reconnecting to scanner...';
  } finally {
    if (mySeq === fetchSeq && dot) dot.classList.remove('syncing');
  }
}

renderSkeletons();
setInterval(() => fetchLive(false), 15000);
setInterval(updateLiveTickers, 1000);
fetchLive(true);
